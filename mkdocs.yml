theme:
    name: material
    language: en
    icon:
        repo: fontawesome/brands/github
    features:
        - announce.dismiss
        - content.action.edit
        - content.action.view
        - content.code.copy
        - navigation.footer
        - navigation.indexes
        - navigation.sections
        - search.highlight
        - search.suggest
        - toc.follow
    palette:
        - media: "(prefers-color-scheme: dark)"
          primary: black
          scheme: slate
          toggle:
              icon: material/brightness-4
              name: Switch to light mode
        - media: "(prefers-color-scheme: light)"
          primary: white
          scheme: default
          toggle:
              icon: material/brightness-7
              name: Switch to dark mode

plugins:
    - search:
          separator: '[\s\-,\.:!=\[\]()"/]+'
    - git-revision-date-localized:
          enable_git_follow: false
          strict: false
          type: date
    - print-site:
          add_cover_page: true
          add_print_site_banner: true
          print_page_title: Offline Docs

markdown_extensions:
    - admonition
    - attr_list
    - def_list
    - footnotes
    - md_in_html
    - tables
    - pymdownx.details
    - pymdownx.highlight:
          line_spans: __span
          pygments_lang_class: true
    - pymdownx.inlinehilite
    - pymdownx.superfences
    - pymdownx.tabbed:
          alternate_style: true
    - pymdownx.tasklist:
          custom_checkbox: true
    - toc:
          title: Page Contents
          permalink: true
          toc_depth: 3

extra_css:
    - stylesheets/extra.css

extra:
    social:
        - icon: fontawesome/brands/github
          link: https://github.com/ken-eizo/after-effects-internals-guide
